[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-rate"
version = "1.0.0"
description = "Freight rate prediction — Spotter ML Engineer assessment"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -rs --strict-markers"
markers = [
    "slow: exercises a full model fit on the real data",
    "contract: asserts the vendor submission contract",
]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["src/freight_rate"]
